<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML, SVG, CSS Y JS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alata&family=Poltawski+Nowy:ital,wght@0,400..700;1,400..700&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <style>
        body{font-family: "Space Grotesk", sans-serif;}
    </style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1155 600" onClick="alert('What?!')">
  <style>
    svg    { font-family: "Space Grotesk", sans-serif; }
    #chart { transform: translate(300px, 300px); }

    .grid  { fill: none; stroke: lightgray; }
    .axes  { fill: none; stroke: #000; }
    .label { font-size: 12px; text-anchor: middle; dominant-baseline: middle; }
    .tick  { font-size: 10px; text-anchor: end; dominant-baseline: middle; }

    .s0 { --c: #FEC60D; }
    .s1 { --c: #1F5592; }
    .s2 { --c: #2ca02c; }
    .s3 { --c: #d62728; }

    .area {
      fill: var(--c);
      stroke: var(--c);
      stroke-width: 1;
      fill-opacity: .1;
      transition: all ease-out .3s;
    }
    .area:hover {
      fill-opacity: .4;
      transition: all ease .4s;
    }
    .dots   { fill: none; stroke: var(--c); stroke-width: 3; stroke-linecap: round; }
    .swatch { fill: var(--c); width: 15px; height: 15px; }

    .legend-title { font-size: 12px; font-weight: bold; }
    .legend-text  { font-size: 10px; }
  </style>

  <g id="chart">
    <!-- Grilla: 10 a 100, cada 10 = 24 px -->
    <circle class="grid" r="24" />
    <circle class="grid" r="48" />
    <circle class="grid" r="72" />
    <circle class="grid" r="96" />
    <circle class="grid" r="120" />
    <circle class="grid" r="144" />
    <circle class="grid" r="168" />
    <circle class="grid" r="192" />
    <circle class="grid" r="216" />
    <circle class="grid" r="240" />

    <!-- Ejes radiales -->
    <path class="axes" d="M0 0V-240M0 0L228.3 -74.2M0 0L141.1 194.2M0 0L-141.1 194.2M0 0L-228.3 -74.2" />

    <text class="label" x="0" y="-250">Academicos con Doctorados</text>
    <text class="label" x="237.8" y="-77.3">Faculty Student</text>
    <text class="label" x="146.9" y="202.3">International Research Network</text>
    <text class="label" x="-146.9" y="202.3">Papers Per Faculty</text>
    <text class="label" x="-237.8" y="-77.3">Citations per Paper</text>

    <!-- Escala vertical -->
    <path class="axes" d="M-6 -240H0V0H-6" />
    <text class="tick" x="-9" y="0">0</text>
    <text class="tick" x="-9" y="-24">10</text>
    <text class="tick" x="-9" y="-48">20</text>
    <text class="tick" x="-9" y="-72">30</text>
    <text class="tick" x="-9" y="-96">40</text>
    <text class="tick" x="-9" y="-120">50</text>
    <text class="tick" x="-9" y="-144">60</text>
    <text class="tick" x="-9" y="-168">70</text>
    <text class="tick" x="-9" y="-192">80</text>
    <text class="tick" x="-9" y="-216">90</text>
    <text class="tick" x="-9" y="-240">100</text>

    <!-- Series: área + puntos -->
    <polygon class="area s0" points="0,-236 163.9,-53.2 141.1,194.2 -137.5,189.3 -176.9,-57.5" />
    <path class="dots s0" d="M0 -236h0M163.9 -53.2h0M141.1 194.2h0M-137.5 189.3h0M-176.9 -57.5h0" />

    <polygon class="area s1" points="0,-173 53.2,-17.3 141.1,194.2 -141.1,194.2 -175.9,-57.2" />
    <path class="dots s1" d="M0 -173h0M53.2 -17.3h0M141.1 194.2h0M-141.1 194.2h0M-175.9 -57.2h0" />

    <polygon class="area s2" points="0,-153 85.6,-27.8 139.3,191.7 -126.4,173.9 -200.7,-65.2" />
    <path class="dots s2" d="M0 -153h0M85.6 -27.8h0M139.3 191.7h0M-126.4 173.9h0M-200.7 -65.2h0" />

    <polygon class="area s3" points="0,-70 68.2,-22.2 138.1,190.1 -114,156.9 -139.8,-45.4" />
    <path class="dots s3" d="M0 -70h0M68.2 -22.2h0M138.1 190.1h0M-114 156.9h0M-139.8 -45.4h0" />
  </g>

  <!-- Leyenda -->
  <text class="legend-title" x="605" y="60">Nombre Institucion</text>

  <rect class="swatch s0" x="605" y="76" />
  <text class="legend-text" x="625" y="88.5">Pontificia Universidad Católica de Chile (PUC)</text>

  <rect class="swatch s1" x="605" y="97.25" />
  <text class="legend-text" x="625" y="109.75">Universidad de Chile (UCH)</text>

  <rect class="swatch s2" x="605" y="118.5" />
  <text class="legend-text" x="625" y="131">Universidad de Concepción (UdeC)</text>

  <rect class="swatch s3" x="605" y="139.75" />
  <text class="legend-text" x="625" y="152.25">Universidad de Santiago de Chile (USACH)</text>
</svg>
    </body>
</html>
